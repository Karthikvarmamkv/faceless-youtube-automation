# Used when this folder becomes its own repository.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q pipeline.py main.py finance_channel
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          python pipeline.py --help
          python pipeline.py hf-models
          python pipeline.py doctor || true
      - name: Offline demo render
        run: |
          python pipeline.py demo --format short
          ls -la data/renders
